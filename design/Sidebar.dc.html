<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<aside style="width: 100%; box-sizing: border-box; background: #1C1B18; color: #F4F2EC; font-family: 'IBM Plex Sans', system-ui, sans-serif; padding: 28px 18px 24px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px;">
    <div aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 10px; background: #E3EEE7; color: #1E5B43; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px;">DG</div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.1;">[Shop name]</span>
      <span style="font-size: 12px; color: #A9A497;">Dry goods · Back office</span>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 4px;">
    <a href="Main.dc.html" aria-current="{{salesCur}}" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: {{salesBg}}; color: {{salesFg}};">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
      Sales report
    </a>
    <a href="AddItem.dc.html" aria-current="{{addCur}}" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: {{addBg}}; color: {{addFg}};">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
      Add item
    </a>
    <a href="Profile.dc.html" aria-current="{{profCur}}" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: {{profBg}}; color: {{profFg}};">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      My profile
    </a>
  </nav>

  <section aria-labelledby="top-h" style="display: flex; flex-direction: column; gap: 14px; padding: 18px 14px; border-radius: 14px; background: #2A2925;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
      <h2 id="top-h" style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 17px;">Top 10 items</h2>
      <span style="font-size: 12px; color: #A9A497;">This month</span>
    </div>
    <div role="group" aria-label="Rank by" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: #1C1B18;">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="min-height: 36px; border: 0; border-radius: 7px; background: {{m.bg}}; color: {{m.fg}}; font: 600 13px 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer;">{{m.label}}</button>
      </sc-for>
    </div>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{top}}" as="t" hint-placeholder-count="10">
        <li style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: baseline; gap: 10px;">
            <span style="width: 18px; flex: 0 0 18px; font: 500 12px 'IBM Plex Mono', ui-monospace, monospace; color: #A9A497;">{{t.rank}}</span>
            <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.3;">{{t.name}}</span>
            <span style="flex: 0 0 auto; font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; color: #F4F2EC;">{{t.value}}</span>
          </div>
          <div aria-hidden="true" style="margin-left: 28px; height: 4px; border-radius: 2px; background: #3A3833; overflow: hidden;">
            <div style="width: {{t.w}}; height: 100%; background: #7BC3A0; border-radius: 2px;"></div>
          </div>
        </li>
      </sc-for>
    </ol>
    <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #A9A497;">{{caption}}</p>
  </section>

  <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 1px solid #3A3833; text-decoration: none; color: #F4F2EC;">
    <span aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; background: #7BC3A0; color: #1C1B18; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px;">MS</span>
    <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span style="font-size: 14px; font-weight: 600;">Maria Santos</span>
      <span style="font-size: 12px; color: #A9A497;">Office staff</span>
    </span>
  </a>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["sales","add","profile"],"default":"sales"},"$preview":{"width":300,"height":1100}}'>
var ITEMS = [
  { name: 'Jasmine rice, 1 kg', base: 90, price: 62, stock: 600 },
  { name: 'White sugar, 1 kg', base: 55, price: 85, stock: 420 },
  { name: 'Cooking oil, 1 L', base: 40, price: 110, stock: 380 },
  { name: 'Sardines in tomato sauce, 155 g', base: 120, price: 26, stock: 520 },
  { name: 'Pancit canton, 60 g', base: 150, price: 16, stock: 700 },
  { name: '3-in-1 coffee, 10 sachets', base: 60, price: 72, stock: 260 },
  { name: 'Iodized salt, 500 g', base: 35, price: 22, stock: 300 },
  { name: 'Corned beef, 150 g', base: 30, price: 48, stock: 340 },
  { name: 'Evaporated milk, 370 ml', base: 45, price: 38, stock: 260 },
  { name: 'Soy sauce, 1 L', base: 25, price: 55, stock: 180 },
  { name: 'All-purpose flour, 1 kg', base: 20, price: 58, stock: 210 },
  { name: 'Mung beans, 500 g', base: 18, price: 60, stock: 160 }
];
var DAYS = 26;
function compact(n) {
  if (n >= 1e6) return '₱' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '₱' + (n / 1e3).toFixed(1) + 'k';
  return '₱' + Math.round(n);
}

class Component extends DCLogic {
  state = { mode: 'turnover' };

  renderVals() {
    var self = this;
    var active = this.props.active ?? 'sales';
    var mode = this.state.mode;
    var rows = ITEMS.map(function (it) {
      var units = it.base * DAYS;
      return { name: it.name, turn: units / it.stock, rev: units * it.price };
    });
    var key = mode === 'turnover' ? 'turn' : 'rev';
    rows.sort(function (a, b) { return b[key] - a[key]; });
    rows = rows.slice(0, 10);
    var max = rows.length ? rows[0][key] : 1;
    function nav(id) {
      var on = active === id;
      return { bg: on ? '#F4F2EC' : 'transparent', fg: on ? '#1C1B18' : '#D9D5CB', cur: on ? 'page' : 'false' };
    }
    var s = nav('sales'), a = nav('add'), p = nav('profile');
    return {
      salesBg: s.bg, salesFg: s.fg, salesCur: s.cur,
      addBg: a.bg, addFg: a.fg, addCur: a.cur,
      profBg: p.bg, profFg: p.fg, profCur: p.cur,
      modes: [
        { id: 'turnover', label: 'Turnover' },
        { id: 'sales', label: 'Sales' }
      ].map(function (m) {
        var on = m.id === mode;
        return {
          label: m.label,
          pressed: on ? 'true' : 'false',
          bg: on ? '#7BC3A0' : 'transparent',
          fg: on ? '#1C1B18' : '#D9D5CB',
          pick: function () { self.setState({ mode: m.id }); }
        };
      }),
      top: rows.map(function (r, i) {
        return {
          rank: i + 1,
          name: r.name,
          value: mode === 'turnover' ? r.turn.toFixed(1) + '×' : compact(r.rev),
          w: (r[key] / max * 100).toFixed(1) + '%'
        };
      }),
      caption: mode === 'turnover'
        ? 'Turnover = units sold ÷ average stock on hand. Higher means the item sells through faster.'
        : 'Ranked by revenue this month.'
    };
  }
}
</script>
</body>
</html>
