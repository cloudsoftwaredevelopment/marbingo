<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1E5B43}a:hover{color:#123D2C}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F2EC; color: #1C1B18; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap;">
  <div style="flex: 1 1 280px; background: #1C1B18; display: flex; flex-direction: column;">
    <dc-import name="Sidebar" active="profile" hint-size="100%,1100px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">

    <header style="display: flex; flex-direction: column; gap: 6px;">
      <p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5A52;">Account</p>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em;">My profile</h1>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px;">

      <section aria-label="Profile summary" style="flex: 1 1 280px; min-width: 0; background: #FFFEFB; border: 1px solid #DDD8CC; border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
        <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{ false }}">
          <img src="{{photo}}" alt="Profile photo" style="width: 112px; height: 112px; border-radius: 50%; object-fit: cover; display: block;">
        </sc-if>
        <sc-if value="{{noPhoto}}" hint-placeholder-val="{{ true }}">
          <div aria-hidden="true" style="width: 112px; height: 112px; border-radius: 50%; background: #7BC3A0; color: #1C1B18; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 38px;">{{initials}}</div>
        </sc-if>
        <label for="avatar" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 10px; border: 1px solid #CFC9BB; font-size: 14px; font-weight: 600; color: #1E5B43; cursor: pointer;">Change photo</label>
        <input id="avatar" type="file" accept="image/png,image/jpeg,image/webp" onChange="{{onPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 22px;">{{fullName}}</span>
          <span style="font-size: 14px; color: #5E5A52;">Office staff</span>
        </div>
        <dl style="width: 100%; margin: 8px 0 0; padding-top: 16px; border-top: 1px solid #ECE8DF; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 16px; text-align: left; font-size: 14px;">
          <dt style="color: #5E5A52;">Employee ID</dt>
          <dd style="margin: 0; text-align: right; font-family: 'IBM Plex Mono', ui-monospace, monospace;">[EMP-ID]</dd>
          <dt style="color: #5E5A52;">Role</dt>
          <dd style="margin: 0; text-align: right;">Office staff</dd>
          <dt style="color: #5E5A52;">Member since</dt>
          <dd style="margin: 0; text-align: right; font-family: 'IBM Plex Mono', ui-monospace, monospace;">[DATE]</dd>
        </dl>
        <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5E5A52;">Role and employee ID are managed by the shop admin.</p>
      </section>

      <div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">

        <form onSubmit="{{saveInfo}}" style="margin: 0; border: 1px solid #DDD8CC; border-radius: 14px; background: #FFFEFB; padding: 24px; display: flex; flex-direction: column; gap: 18px;">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 20px;">Personal information</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="first" style="font-size: 13px; font-weight: 600;">First name</label>
              <input id="first" type="text" autocomplete="given-name" value="{{first}}" onChange="{{onFirst}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="last" style="font-size: 13px; font-weight: 600;">Last name</label>
              <input id="last" type="text" autocomplete="family-name" value="{{last}}" onChange="{{onLast}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="email" style="font-size: 13px; font-weight: 600;">Email</label>
              <input id="email" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="mobile" style="font-size: 13px; font-weight: 600;">Mobile number</label>
              <input id="mobile" type="tel" autocomplete="tel" value="{{mobile}}" onChange="{{onMobile}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 500 15px 'IBM Plex Mono', ui-monospace, monospace; color: #1C1B18;">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="addr" style="font-size: 13px; font-weight: 600;">Address</label>
            <input id="addr" type="text" autocomplete="street-address" value="{{addr}}" onChange="{{onAddr}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
          </div>
          <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px;">
            <sc-if value="{{infoSaved}}" hint-placeholder-val="{{ false }}">
              <span role="status" style="font-size: 14px; font-weight: 500; color: #1E5B43;">Changes saved.</span>
            </sc-if>
            <button type="submit" style="min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #1E5B43; color: #FFFFFF; font: 600 15px 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer;">Save changes</button>
          </div>
        </form>

        <form onSubmit="{{savePw}}" style="margin: 0; border: 1px solid #DDD8CC; border-radius: 14px; background: #FFFEFB; padding: 24px; display: flex; flex-direction: column; gap: 18px;">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 20px;">Change password</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="cur" style="font-size: 13px; font-weight: 600;">Current password</label>
              <input id="cur" type="password" autocomplete="current-password" value="{{cur}}" onChange="{{onCur}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="new" style="font-size: 13px; font-weight: 600;">New password</label>
              <input id="new" type="password" autocomplete="new-password" value="{{pw}}" onChange="{{onPw}}" aria-describedby="pw-hint" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
              <span id="pw-hint" style="font-size: 12px; color: #5E5A52;">At least 8 characters.</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="confirm" style="font-size: 13px; font-weight: 600;">Confirm new password</label>
              <input id="confirm" type="password" autocomplete="new-password" value="{{pw2}}" onChange="{{onPw2}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC9BB; border-radius: 10px; background: #FFFFFF; font: 400 15px 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B18;">
            </div>
          </div>
          <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px;">
            <sc-if value="{{pwShow}}" hint-placeholder-val="{{ false }}">
              <span role="status" style="font-size: 14px; font-weight: 500; color: {{pwColor}};">{{pwMsg}}</span>
            </sc-if>
            <button type="submit" style="min-height: 44px; padding: 0 22px; border-radius: 10px; border: 1px solid #1E5B43; background: #FFFEFB; color: #1E5B43; font: 600 15px 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer;">Update password</button>
          </div>
        </form>

      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  state = {
    first: 'Maria', last: 'Santos', email: 'maria.santos@example.com', mobile: '+63 9XX XXX XXXX', addr: '',
    photo: '', infoSaved: false,
    cur: '', pw: '', pw2: '', pwMsg: '', pwOk: false
  };

  renderVals() {
    var self = this;
    var s = this.state;
    function info(k) { return function (e) { var o = { infoSaved: false }; o[k] = e.target.value; self.setState(o); }; }
    function pwf(k) { return function (e) { var o = { pwMsg: '' }; o[k] = e.target.value; self.setState(o); }; }
    var full = (s.first + ' ' + s.last).trim() || 'Your name';
    var initials = ((s.first[0] || '') + (s.last[0] || '')).toUpperCase() || '?';
    return {
      first: s.first, last: s.last, email: s.email, mobile: s.mobile, addr: s.addr,
      onFirst: info('first'), onLast: info('last'), onEmail: info('email'), onMobile: info('mobile'), onAddr: info('addr'),
      fullName: full,
      initials: initials,
      photo: s.photo,
      hasPhoto: s.photo !== '',
      noPhoto: s.photo === '',
      onPhoto: function (e) {
        var f = e.target.files && e.target.files[0];
        if (f) self.setState({ photo: URL.createObjectURL(f) });
      },
      infoSaved: s.infoSaved,
      saveInfo: function (e) { e.preventDefault(); self.setState({ infoSaved: true }); },
      cur: s.cur, pw: s.pw, pw2: s.pw2,
      onCur: pwf('cur'), onPw: pwf('pw'), onPw2: pwf('pw2'),
      pwShow: s.pwMsg !== '',
      pwMsg: s.pwMsg,
      pwColor: s.pwOk ? '#1E5B43' : '#A12A1E',
      savePw: function (e) {
        e.preventDefault();
        if (!s.cur) return self.setState({ pwMsg: 'Enter your current password.', pwOk: false });
        if (s.pw.length < 8) return self.setState({ pwMsg: 'New password needs at least 8 characters.', pwOk: false });
        if (s.pw !== s.pw2) return self.setState({ pwMsg: 'The new passwords don’t match.', pwOk: false });
        self.setState({ cur: '', pw: '', pw2: '', pwMsg: 'Password updated.', pwOk: true });
      }
    };
  }
}
</script>
</body>
</html>
